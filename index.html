<!doctype html>
<html lang="th"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>MUMUJUU สั่งน้ำ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Gaegu:wght@400;700&family=Mali:wght@500;600;700&family=IBM+Plex+Sans+Thai:wght@400;500;600&display=swap" rel="stylesheet">
<script>window.SHOP_API = "https://script.google.com/macros/s/AKfycbyD6UJzxChhwa9aBqCZakiMJMZ_KHTBdEDGc3jDxCtgFOfjGgxLME9dKrcO6BrltzNjVA/exec";</script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
:root{--paper:#FFFDF6;--cream:#F8F4E2;--ink:#2C2830;--olive:#7A7A3A;--oliveL:#C9CF94;--peach:#E8A9A6;--velvet:#B35157;--line:#E3DCC6;--muted:#6F6A70;--ok:#4E7A45;
  --display:"Mali",ui-rounded,"Thonburi",system-ui,sans-serif;--body:"IBM Plex Sans Thai","Thonburi",system-ui,sans-serif}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--cream);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.45;-webkit-text-size-adjust:100%}
button,input,textarea{font:inherit;color:inherit}
.wrap{max-width:480px;margin:0 auto;padding:16px 16px 120px}
header{text-align:center;padding:6px 0 10px}
header img{width:180px;max-width:60%;height:auto;display:block;margin:0 auto}
header h1{font-family:var(--display);font-size:22px;margin:6px 0 2px}
.round{display:inline-flex;flex-wrap:wrap;justify-content:center;gap:6px;font-size:14px;color:var(--muted)}
.badge{display:inline-block;font-family:var(--display);font-weight:600;font-size:14px;padding:3px 12px;border-radius:999px;background:var(--oliveL);color:#3F4A1C;margin-top:6px}
.badge.out{background:#F3DEDB;color:var(--velvet)}
.card{background:var(--paper);border:2px solid var(--ink);border-radius:18px;padding:14px;margin-top:12px}
.card h2{font-family:var(--display);font-size:17px;margin:0 0 8px;display:flex;align-items:center;gap:8px}
.card h2 .n{background:var(--ink);color:var(--cream);border-radius:999px;width:22px;height:22px;display:inline-grid;place-items:center;font-size:12px;flex:none}
.item{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1.5px dashed var(--line)}
.item:first-of-type{border-top:0}
.item .tx{flex:1;min-width:0}
.item b{font-family:var(--display);font-size:17px;display:block}
.item small{color:var(--muted);font-size:13px;display:block}
.item .pr{font-family:var(--display);font-weight:700;color:var(--olive);white-space:nowrap}
.item .pr s{color:var(--muted);font-weight:500;font-size:13px;margin-right:4px}
.step{display:flex;align-items:center;gap:6px}
.step button{width:34px;height:34px;border-radius:50%;border:2px solid var(--ink);background:var(--paper);font-size:18px;font-weight:700;line-height:1;padding:0;cursor:pointer}
.step button.plus{background:var(--oliveL)}
.step button:disabled{opacity:.35;cursor:default}
.step output{min-width:20px;text-align:center;font-family:var(--display);font-weight:700;font-size:17px}
.pills{display:flex;flex-wrap:wrap;gap:8px}
.pills label{cursor:pointer}
.pills input{position:absolute;opacity:0;pointer-events:none}
.pills span{display:block;border:2px solid var(--ink);border-radius:999px;padding:6px 14px;background:var(--paper);font-weight:500}
.pills input:checked+span{background:var(--ink);color:var(--cream)}
.pills input:focus-visible+span{outline:3px solid var(--peach);outline-offset:2px}
.hint{font-size:13px;color:var(--muted);margin:8px 0 0}
.field{display:grid;gap:4px;margin-top:10px}
.field label{font-size:14px;font-weight:500}
.field input,.field textarea{border:2px solid var(--line);border-radius:12px;padding:9px 11px;background:#fff;width:100%}
.field input:focus,.field textarea:focus{outline:none;border-color:var(--olive)}
.pay{text-align:center}
#qr{display:grid;place-items:center;margin:10px auto;min-height:190px}
#qr img,#qr canvas{border:6px solid #fff;border-radius:8px}
.qr-demo{width:190px;height:190px;border:2px dashed var(--line);border-radius:12px;display:grid;place-items:center;padding:12px;font-size:13px;color:var(--muted)}
.amt{font-family:var(--display);font-size:24px;font-weight:700}
.slip{display:block;margin:10px auto 0;border:2px dashed var(--ink);border-radius:14px;padding:12px;cursor:pointer;background:var(--cream);font-weight:500}
.slip input{display:none}
.slip img{display:block;max-width:140px;max-height:200px;margin:8px auto 0;border-radius:8px}
.err{color:var(--velvet);font-size:14px;text-align:center;margin:10px 0 0;min-height:0}
.err:empty{display:none}
.foot{position:fixed;left:0;right:0;bottom:0;background:var(--paper);border-top:2px solid var(--ink);padding:10px 16px calc(12px + env(safe-area-inset-bottom,0px))}
.foot .in{max-width:480px;margin:0 auto;display:flex;align-items:center;gap:12px}
.foot .tot{flex:1;font-size:13px;color:var(--muted)}
.foot .tot b{display:block;font-family:var(--display);font-size:22px;color:var(--ink)}
.cta{border:3px solid var(--ink);background:var(--peach);border-radius:16px;padding:10px 18px;font-family:var(--display);font-weight:700;font-size:17px;box-shadow:0 4px 0 var(--ink);cursor:pointer;white-space:nowrap}
.cta.green{background:var(--oliveL)}
.cta:active{transform:translateY(2px);box-shadow:0 2px 0 var(--ink)}
.cta:disabled{opacity:.45;cursor:default;transform:none;box-shadow:0 4px 0 var(--ink)}
.done{text-align:center}
.done .ok{display:inline-block;background:#E3EED3;color:#3F5A2A;border-radius:999px;padding:4px 14px;font-weight:600;margin:4px 0 8px}
.done .no{font-family:var(--display);font-size:22px;font-weight:700}
.done ul{list-style:none;padding:0;margin:10px 0;text-align:left;border-top:1.5px dashed var(--line);border-bottom:1.5px dashed var(--line)}
.done li{display:flex;justify-content:space-between;padding:6px 0}
.done .deliv{background:var(--cream);border-radius:12px;padding:10px;text-align:left;font-size:14px}
.note{font-size:14px;color:var(--muted);text-align:center;margin:10px 0 0}
.links{text-align:center;margin:18px 0 0;font-size:14px}
.links a{color:var(--olive);font-weight:600}
.closed{font-family:var(--display);text-align:center;font-size:17px;padding:10px 0}
.loading{text-align:center;color:var(--muted);padding:40px 0}
.tabs{display:flex;justify-content:center;gap:8px;margin-top:10px}
.tabs button{border:2px solid var(--ink);background:var(--paper);border-radius:999px;padding:6px 14px;font-family:var(--display);font-weight:600;font-size:15px;cursor:pointer}
.tabs button[aria-pressed="true"]{background:var(--ink);color:var(--cream)}
.hcard{border:2px solid var(--line);border-radius:14px;padding:10px 12px;background:#fff;display:grid;gap:3px;margin-top:10px;font-size:14px}
.hcard .top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.hcard .top b{font-family:var(--display);font-size:16px}
.hcard small{color:var(--muted)}
.hcard .tot{display:flex;justify-content:space-between;font-weight:600}
.st{font-size:12px;font-weight:600;padding:3px 10px;border-radius:999px;white-space:nowrap;background:#F3E7C9;color:#7A5A1E}
.st.paid{background:#E3EED3;color:#3F5A2A}.st.sent{background:#DCEAF3;color:#2D5470}.st.cancel{background:#F3DEDB;color:#8A3B33}
.ghost{border:2px solid var(--ink);background:var(--paper);border-radius:14px;padding:8px 14px;font-weight:600;cursor:pointer}
.savelink{background:var(--cream);border-radius:12px;padding:10px;margin-top:10px;font-size:14px;text-align:center}
.savelink a{color:var(--olive);font-weight:600;word-break:break-all}
.lt{display:inline-block;margin-top:3px;font-size:12px;font-weight:600;padding:1px 9px;border-radius:999px;background:#E3EED3;color:#3F5A2A}.lt.out{background:#F3DEDB;color:#8A3B33}
.demo{background:#FFF4D6;border:1.5px dashed #C9A54A;border-radius:12px;padding:8px 10px;font-size:13px;color:#7A5A1E;text-align:center;margin-top:8px}
</style>
</head>
<body>
<div id="intro">
<style>#intro{--s-paper:#FBF5E4;--s-ink:#3B342F;--s-olive:#7A8A3C;--oliveD:#5E6B2C;--s-pink:#C98B86;--matcha:#9DB04E;--foam:#C9D78C;--milk:#FFFDF7;
  --s-hand:"Gaegu","Mali",ui-rounded,"Thonburi",system-ui,sans-serif;--s-thai:"Mali",ui-rounded,"Thonburi",system-ui,sans-serif;background:var(--s-paper);color:var(--s-ink);font-family:var(--s-thai)}
#intro .skip{white-space:nowrap;font-family:var(--s-thai);font-weight:600;font-size:14px;color:var(--s-ink);background:var(--foam);border:2px solid var(--s-ink);border-radius:999px;padding:5px 12px;text-decoration:none}
#intro .sc-go{display:inline-block;margin-top:8px;font-family:var(--s-thai);font-weight:700;font-size:18px;color:var(--s-ink);background:var(--foam);border:3px solid var(--s-ink);border-radius:16px;padding:8px 26px;box-shadow:0 4px 0 var(--s-ink);text-decoration:none}
body.intro-on .foot{display:none}
#intro .sc-go[hidden]{display:none}

#intro .track{height:560vh;position:relative}
#intro .stage{position:sticky;top:0;height:100vh;height:100svh;display:grid;grid-template-rows:auto 1fr auto;
  padding-block:calc(14px + env(safe-area-inset-top,0px)) calc(18px + env(safe-area-inset-bottom,0px));
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));overflow:hidden}
#intro .top{display:flex;justify-content:space-between;align-items:center;max-width:560px;width:100%;margin:0 auto}
#intro .brand{font-family:var(--s-hand);font-weight:700;font-size:26px;letter-spacing:.06em;line-height:1}
#intro .topr{display:flex;align-items:center;gap:8px}
#intro .brand small{display:block;font-size:14px;letter-spacing:.3em;color:var(--s-olive)}
#intro .dots{display:flex;gap:6px}
#intro .dots i{width:9px;height:9px;border-radius:50%;border:2px solid var(--s-olive);transition:background .2s}
#intro .dots i.on{background:var(--s-olive)}
#intro svg.scene{width:100%;height:100%;max-width:560px;margin:0 auto;display:block;min-height:0}
#intro .cap{text-align:center;max-width:560px;margin:0 auto;min-height:92px}
#intro .cap .en{font-family:var(--s-hand);font-weight:700;font-size:clamp(30px,8vw,44px);line-height:1;letter-spacing:.02em;text-wrap:balance}
#intro .cap .th{font-size:16px;color:var(--s-pink);margin-top:6px;font-weight:600}
#intro .cap .hint{font-family:var(--s-hand);font-size:20px;color:var(--s-olive);margin-top:6px}
#intro svg .o{fill:none;stroke:var(--s-ink);stroke-width:5;stroke-linecap:round;stroke-linejoin:round}
#intro svg .ok{stroke:var(--s-ink)}
#intro svg .pp{fill:var(--s-paper)}
#intro svg .note{font-family:var(--s-hand);font-weight:700;font-size:21px;fill:var(--s-ink)}
#intro svg .arrow{fill:none;stroke:var(--s-ink);stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}

</style>
<div class="track" id="track">
  <div class="stage">
    <div class="top">
      <div class="brand">MUMUJUU<small>STUDIO</small></div>
      <div class="topr" id="topr"><a class="skip" href="#order" id="skipIntro">สั่งเลย →</a></div>
    </div>

    <svg class="scene" id="scene" viewBox="0 0 400 520" role="img" aria-label="ภาพวาดขั้นตอนชงมัทฉะเย็น">
      <defs>
        <filter id="wob"><feTurbulence type="fractalNoise" baseFrequency="0.035" numOctaves="2" seed="4"/><feDisplacementMap in="SourceGraphic" scale="4"/></filter>
        <clipPath id="bowlIn"><path d="M-62 0h124c0 52-26 84-62 84s-62-32-62-84z"/></clipPath>
        <clipPath id="glassIn"><path d="M-46 0h92l-10 156c-1 9-7 14-15 14h-42c-8 0-14-5-15-14z"/></clipPath>
      </defs>
      <g filter="url(#wob)">
        <!-- table line -->
        <path class="o" d="M20 470c90-6 270-6 360 0" opacity=".55"/>

        <!-- cold milk carton (cold whisk: no hot water) -->
        <g id="kettle" opacity="0">
          <path class="o pp" d="M-26 -30h52v78c0 4-3 6-6 6h-40c-3 0-6-2-6-6z"/>
          <path class="o pp" d="M-26 -30l10-24h32l10 24z"/>
          <path class="o pp" d="M-16 -54v-8h32v8"/>
          <text x="0" y="14" text-anchor="middle" style="font-family:var(--hand);font-weight:700;font-size:17px;fill:var(--ink)">milk</text>
          <path class="o" style="stroke:var(--pink);stroke-width:3" d="M-8 26c4 4 12 4 16 0"/>
          <path class="o" style="stroke:#9CC3D5;stroke-width:3" d="M-38 -14v8M-42 8v6M38 -4v8"/>
        </g>
        <path id="water" class="o" style="stroke:#E6DDC6;stroke-width:7" d="M0 0" opacity="0"/>

        <!-- matcha scoop + powder -->
        <g id="scoop" opacity="0">
          <path class="o" stroke="#B98B4E" d="M-70 0h70"/>
          <path class="o pp" stroke="#B98B4E" d="M0 -6c14 0 20 6 20 6s-6 7-20 7z"/>
          <circle cx="10" cy="-3" r="5" fill="var(--matcha)"/>
        </g>
        <g id="powder"></g>

        <!-- bowl -->
        <g id="bowl" transform="translate(150 360)">
          <g clip-path="url(#bowlIn)">
            <rect id="bowlTea" x="-70" y="90" width="140" height="100" fill="var(--matcha)"/>
            <g id="froth" opacity="0"></g>
          </g>
          <path class="o" d="M-62 0h124c0 52-26 84-62 84s-62-32-62-84z"/>
          <path class="o" d="M-24 84v10h48v-10"/>
          <path class="o" d="M-40 42c8 6 14 6 22 0M6 50c8 6 14 6 22 0" stroke-width="3" opacity=".6"/>
        </g>

        <!-- whisk -->
        <g id="whisk" opacity="0">
          <rect class="o pp" stroke="#B98B4E" x="-8" y="-110" width="16" height="60" rx="5"/>
          <path class="o" stroke="#B98B4E" stroke-width="3" d="M-8 -50c-14 16-20 34-20 50M-3 -50c-6 16-8 34-8 50M3 -50c6 16 8 34 8 50M8 -50c14 16 20 34 20 50M0 -50v50"/>
        </g>

        <!-- glass -->
        <g id="glass" transform="translate(275 296)" opacity="0">
          <g clip-path="url(#glassIn)">
            <rect id="milk" x="-60" y="180" width="120" height="180" fill="var(--milk)"/>
            <rect id="glassTea" x="-60" y="180" width="120" height="60" fill="var(--matcha)"/>
            <path id="swirl" d="M-40 0" fill="none" stroke="var(--foam)" stroke-width="6" stroke-linecap="round" opacity="0"/>
            <g id="ice"></g>
          </g>
          <path class="o" d="M-46 0h92l-10 156c-1 9-7 14-15 14h-42c-8 0-14-5-15-14z"/>
          <path class="o" d="M-52 0h104"/>
          <g id="straw" opacity="0"><path class="o" style="stroke-width:11" d="M14 140l20 -190"/><path class="o" style="stroke:#F6C3CD;stroke-width:6" d="M14 140l20 -190"/></g>
        </g>

        <!-- milk pitcher -->
        <g id="pitcher" opacity="0">
          <path class="o pp" d="M-30 -40h50l-4 70c0 8-6 12-14 12h-14c-8 0-14-4-14-12z"/>
          <path class="o" d="M-30 -40l-10 -8"/>
          <path class="o" d="M20 -30c18 0 18 34 -2 34"/>
        </g>
        <path id="milkStream" class="o" style="stroke:#E6DDC6;stroke-width:7" d="M0 0" opacity="0"/>
        <path id="teaStream" class="o" style="stroke:var(--matcha);stroke-width:7" d="M0 0" opacity="0"/>

        <!-- sparkles -->
        <g id="spark" opacity="0" fill="var(--ink)">
          <path d="M80 150l6 14 14 6-14 6-6 14-6-14-14-6 14-6z"/>
          <path d="M330 120l5 11 11 5-11 5-5 11-5-11-11-5 11-5z"/>
          <path d="M350 300l4 9 9 4-9 4-4 9-4-9-9-4 9-4z"/>
        </g>
      </g>

    </svg>

    <div class="cap" aria-live="polite">
      <div class="en" id="capEn">MATCHA COLD WHISK</div>
      <div class="th" id="capTh">เลื่อนลงเพื่อชงมัทฉะแก้วนี้ไปด้วยกัน</div>
      <div class="hint" id="capHint">scroll ↓</div><a class="sc-go" href="#order" id="introGo" hidden>สั่งเลย 🍵</a>
    </div>
  </div>
</div>
<script>
(function(){
  const $ = id => document.getElementById(id);
  const clamp = (v, a = 0, b = 1) => Math.min(b, Math.max(a, v));
  const seg = (p, a, b) => clamp((p - a) / (b - a));
  const ease = t => t < .5 ? 2*t*t : 1 - Math.pow(-2*t + 2, 2) / 2;
  const lerp = (a, b, t) => a + (b - a) * t;
  const fade = (p, a, b, f = .03) => Math.min(seg(p, a - f, a), 1 - seg(p, b, b + f));   // in at a, out at b

  // the order link: on the real shop this page gets ORDER_URL from the server

  const STEPS = [
    [0.00, "MATCHA COLD WHISK", "เลื่อนลงเพื่อชงมัทฉะแก้วนี้ไปด้วยกัน", "scroll ↓"],
    [0.86, "MATCHA COLD WHISK", "no added syrup · lactose-free milk", ""]
  ];

  // powder particles, froth bubbles, ice cubes
  const NS = "http://www.w3.org/2000/svg";
  const mk = (tag, attrs, parent) => { const e = document.createElementNS(NS, tag); for(const k in attrs) e.setAttribute(k, attrs[k]); parent.appendChild(e); return e; };
  const grains = Array.from({length: 26}, (_, i) => ({el: mk("circle", {r: 2 + (i % 3), fill: "var(--matcha)"}, $("powder")), dx: ((i * 37) % 41) - 20, d: (i * 0.137) % 1}));
  const bubbles = Array.from({length: 14}, (_, i) => mk("circle", {cx: -50 + (i * 53) % 100, cy: 0, r: 3 + (i % 4) * 1.6, fill: "var(--foam)", stroke: "var(--oliveD)", "stroke-width": 1.2}, $("froth")));
  const cubes = [[-26, 0, -12], [8, 0, 10], [-8, 0, 24]].map(([x, y, r]) => mk("rect", {x: -14, y: -14, width: 28, height: 28, rx: 6, fill: "rgba(255,255,255,.75)", stroke: "#9CC3D5", "stroke-width": 3, "data-x": x, "data-r": r}, $("ice")));

  let last = -1;
  function draw(p){
    // --- bowl contents ---
    const sift = seg(p, .04, .2), water = seg(p, .18, .32), whisk = seg(p, .3, .5), pourOut = seg(p, .7, .84);
    const level = 90 - sift * 14 - water * 30 + pourOut * 50;          // y of the tea surface inside the bowl
    $("bowlTea").setAttribute("y", Math.min(90, level));
    $("bowlTea").setAttribute("fill", water > 0 ? "var(--matcha)" : "#B7C46A");

    // scoop + falling powder
    const sc = fade(p, .04, .21, .04);
    $("scoop").setAttribute("opacity", sc);
    $("scoop").setAttribute("transform", `translate(${168} ${250 - sc * 10}) rotate(${lerp(-8, 28, sift)})`);
    grains.forEach(g => {
      const t = (sift * 3 + g.d) % 1;
      g.el.setAttribute("cx", 160 + g.dx * .6 + t * 4);
      g.el.setAttribute("cy", 262 + t * 120);
      g.el.setAttribute("opacity", sift > 0 && sift < 1 ? 1 - t * .6 : 0);
    });

    // kettle + water stream
    const kt = fade(p, .17, .33, .04);
    $("kettle").setAttribute("opacity", kt);
    $("kettle").setAttribute("transform", `translate(80 ${210 - kt * 10}) rotate(${lerp(0, 62, ease(water))})`);
    const ws = water > .3 && water < 1;
    $("water").setAttribute("opacity", ws ? 1 : 0);
    $("water").setAttribute("d", "M144 196c4 40 6 110 6 170");

    // whisk: down into the bowl, then side to side
    const wk = fade(p, .29, .51, .04);
    const wx = 150 + Math.sin(whisk * Math.PI * 14) * 22 * (whisk > 0 && whisk < 1 ? 1 : 0);
    $("whisk").setAttribute("opacity", wk);
    $("whisk").setAttribute("transform", `translate(${wx} ${lerp(280, 372, ease(clamp(wk * 1.4)))})`);
    $("froth").setAttribute("opacity", clamp(whisk * 1.6) * (1 - pourOut));
    bubbles.forEach((b, i) => b.setAttribute("cy", level + 4 + Math.sin(i + whisk * 9) * 2));

    // glass slides in, ice drops, milk pours
    const gl = ease(seg(p, .44, .54)), ice = seg(p, .5, .6), milk = seg(p, .56, .7), fin = ease(seg(p, .82, .94));
    $("glass").setAttribute("opacity", gl);
    const gx = lerp(lerp(420, 275, gl), 200, fin), gy = lerp(296, 260, fin), gs = lerp(1, 1.25, fin);
    $("glass").setAttribute("transform", `translate(${gx} ${gy}) scale(${gs})`);
    cubes.forEach((c, i) => {
      const t = ease(clamp(ice * 1.6 - i * .25));
      const floatY = 150 - 30 * i - milk * 40;
      c.setAttribute("transform", `translate(${c.dataset.x} ${lerp(-60, floatY, t)}) rotate(${c.dataset.r})`);
      c.setAttribute("opacity", t);
    });
    $("milk").setAttribute("y", lerp(172, 70, milk));
    const pt = fade(p, .55, .71, .04);
    $("pitcher").setAttribute("opacity", pt);
    $("pitcher").setAttribute("transform", `translate(330 ${150 - pt * 6}) rotate(${lerp(0, -38, ease(milk))})`);
    $("milkStream").setAttribute("opacity", milk > 0 && milk < 1 ? 1 : 0);
    $("milkStream").setAttribute("d", "M296 128c-12 30-14 90-14 150");

    // bowl lifts and pours matcha into the glass
    const lift = ease(seg(p, .64, .72));
    const bx = lerp(150, 205, lift), by = lerp(360, 190, lift), br = lerp(0, 48, ease(seg(p, .68, .74))) * (1 - seg(p, .84, .88));
    $("bowl").setAttribute("transform", `translate(${bx} ${by}) rotate(${br})`);
    $("bowl").setAttribute("opacity", 1 - seg(p, .84, .89));
    $("teaStream").setAttribute("opacity", pourOut > 0 && pourOut < 1 ? 1 : 0);
    $("teaStream").setAttribute("d", "M262 226c10 20 12 50 12 80");
    $("glassTea").setAttribute("y", lerp(70, 22, pourOut));
    $("glassTea").setAttribute("height", lerp(0, 52, pourOut));
    $("swirl").setAttribute("opacity", pourOut * .9);
    $("swirl").setAttribute("d", `M-40 ${lerp(70, 74, pourOut)}c14 10 26-10 40 0s26 10 40 0`);
    $("straw").setAttribute("opacity", fin);
    $("spark").setAttribute("opacity", fin);


    // caption + dots
    let s = 0; STEPS.forEach((st, i) => { if(p >= st[0]) s = i; });
    if(s !== last){
      last = s;
      $("capEn").textContent = STEPS[s][1]; $("capTh").textContent = STEPS[s][2]; $("capHint").textContent = STEPS[s][3];
    }
  }

  const track = $("track");
  let ticking = false;
  function onScroll(){
    if(ticking) return; ticking = true;
    requestAnimationFrame(() => {
      ticking = false;
      const r = track.getBoundingClientRect();
      const span = track.offsetHeight - window.innerHeight;
      draw(clamp(-r.top / Math.max(1, span)));
    });
  }
  window.addEventListener("scroll", onScroll, {passive: true});
  window.addEventListener("resize", onScroll);
  // order button shows on the last step; the bottom order bar hides while the intro is on screen
  function introState(){
    const r = track.getBoundingClientRect();
    document.body.classList.toggle("intro-on", r.bottom > window.innerHeight * .6);
    $("introGo").hidden = !(-r.top / Math.max(1, track.offsetHeight - window.innerHeight) > .86);
  }
  window.addEventListener("scroll", introState, {passive: true});
  const jump = e => { e.preventDefault(); document.getElementById("order").scrollIntoView({behavior: "smooth"}); };
  $("skipIntro").addEventListener("click", jump); $("introGo").addEventListener("click", jump);
  window.MJ_INTRO = { hide(){ document.getElementById("intro").hidden = true; document.body.classList.remove("intro-on"); } };
  draw(0); introState();
})();
</script>

<script>
(function(){
  /* ---------- where the data comes from ----------
     1. Apps Script page (link .../exec?p=quick): the server puts the sheet config here and google.script.run works
     2. Any other host (e.g. GitHub Pages): set window.SHOP_API to the /exec link, it talks to the JSON API
     3. Neither: demo with sample data, nothing is sent */
  const SERVER = /*SERVER_CFG*/null;
  const GAS = !!(SERVER && window.google && google.script && google.script.run);
  const API = window.SHOP_API || "";
  const DEMO = !GAS && !API;

  function call(name, args){
    if(GAS) return new Promise((ok, no) => {
      google.script.run.withSuccessHandler(ok).withFailureHandler(no)[name](...args);
    });
    if(API){
      const req = name === "submitOrder"
        ? fetch(API, {method: "POST", body: JSON.stringify({action: name, args})})
        : fetch(API + "?api=" + encodeURIComponent(name) + "&args=" + encodeURIComponent(JSON.stringify(args)));

        {orderNo: "MJ-DEMO-000", time: "7/11/26 09:12", date: "เสาร์ 7 พ.ย. 11:30-12:30", place: "11D", items: "Nut tii ×1, Avocadii ×1", total: 180, status: "ชำระแล้ว"}]);
      else ok(C);
    }, 500));
  }
  const DEMO_CFG = {
    shopName: "MUMUJUU", shopSub: "studio", deliveryDate: "เสาร์ 7 พ.ย.", deliveryTime: "11:30-12:30",
    shopNote: "Thank you for your support 💗 Enjoy! 👀🫶🏻", promptpay: "", open: true, maxCups: 0, left: null,

  const $ = s => document.querySelector(s);

  const baht = n => "฿" + Number(n).toLocaleString("en-US");

  let C = null;                 // shop config from the sheet

  try{ const saved = JSON.parse(localStorage.getItem("mumujuu-quick-me") || "null"); if(saved){ S.name = saved.name || ""; S.contact = saved.contact || ""; S.q = {name: S.name, contact: S.contact}; } }catch(e){}
  const DEMO_ORDERS = [];

  function device(){

  // cup limit per menu: server sends items [{id, limit, left}]

  const cups = () => C.mains.reduce((t, m) => t + (S.mq[m.id] || 0), 0);

    $("#demoNote").innerHTML = DEMO ? `<div class="demo">หน้าตัวอย่าง · ข้อมูลจากชีตจริงจะขึ้นเมื่อเปิดผ่านลิงก์ร้าน</div>` : "";

  function itemRow(it, kind, q, max){
    const pr = kind === "m" ? (it.promo > 0 ? `<s>${baht(it.price)}</s>${baht(it.promo)}` : baht(it.price)) : "+" + baht(it.price);
    return `<div class="item">
      <div class="tx"><b>${esc(it.name)}</b>${it.desc ? `<small>${esc(it.desc)}</small>` : ""}${kind === "m" && it.left != null ? (it.left > 0 ? `<span class="lt">เหลือ ${it.left} แก้ว</span>` : `<span class="lt out">หมดแล้ว</span>`) : ""}</div>
      <span class="pr">${pr}</span>
      <div class="step">
        <button type="button" data-k="${kind}" data-id="${it.id}" data-d="-1" ${q ? "" : "disabled"} aria-label="ลด ${esc(it.name)}">−</button>
        <output>${q}</output>

      </div></div>`;
  }

  function render(){
    header();
    const main = $("#main"), foot = $("#foot");
    if(S.view === "status"){ foot.hidden = true; main.innerHTML = statusHTML(); return; }
    if(S.step === "done"){ foot.hidden = true; main.innerHTML = doneHTML(); return; }

      foot.hidden = true;
      main.innerHTML = `<div class="card closed">${!C.open ? "ตอนนี้ร้านปิดรับออเดอร์ค่ะ แวะมาใหม่รอบหน้านะคะ 💚" : "รอบนี้ครบจำนวนแล้วค่ะ ขอบคุณมากนะคะ 💚"}</div>`;

    const full = l != null && cups() >= l;
    const n = (i => () => ++i)(0);
    main.innerHTML = `
    <section class="card"><h2><span class="n">${n()}</span>เลือกเมนู</h2>
      ${C.mains.map(m => itemRow(m, "m", S.mq[m.id] || 0, full || cups() >= 20 || (m.left != null && (S.mq[m.id] || 0) >= m.left))).join("")}

    </section>
    ${C.addons.length ? `<section class="card"><h2><span class="n">${n()}</span>add on</h2>
      ${C.addons.map(a => itemRow(a, "a", S.aq[a.id] || 0, (S.aq[a.id] || 0) >= 20)).join("")}</section>` : ""}
    <section class="card"><h2><span class="n">${n()}</span>ส่งที่ไหน</h2>
      <div class="pills" role="radiogroup">${C.places.map(p => `<label><input type="radio" name="loc" value="${esc(p.name)}" ${S.loc === p.name ? "checked" : ""}><span>${esc(p.name)}</span></label>`).join("")}</div>
      ${placeObj() && placeObj().detail ? `<div class="field"><label for="detail">${esc(placeObj().detail)}</label><input id="detail" value="${esc(S.detail)}"></div>` : ""}
      ${C.locHint ? `<p class="hint">${esc(C.locHint)}</p>` : ""}
    </section>
    <section class="card"><h2><span class="n">${n()}</span>ผู้สั่ง</h2>
      <div class="field" style="margin-top:0"><label for="name">ชื่อ</label><input id="name" value="${esc(S.name)}" autocomplete="name"></div>
      <div class="field"><label for="contact">ช่องทางติดต่อ (เบอร์โทร / LINE ID / IG)</label><input id="contact" value="${esc(S.contact)}"></div>
      <div class="field"><label for="comment">comment ถึงร้าน (ถ้ามี)</label><textarea id="comment" rows="2" placeholder="เช่น ส่งตึกไหน ชั้นไหน หน้าแผนกอะไร">${esc(S.comment)}</textarea></div>
    </section>
    ${S.step === "pay" ? `<section class="card pay" id="paySec"><h2><span class="n">${n()}</span>จ่ายเงิน + แนบสลิป</h2>
      <div class="amt">${baht(total())}</div>
      <div id="qr"></div>
      <small style="color:var(--muted)">${C.promptpay ? "PromptPay " + esc(maskPP(C.promptpay)) : ""}</small>
      <label class="slip">${S.slip ? "✓ แนบสลิปแล้ว (แตะเพื่อเปลี่ยน)" : "📎 แตะเพื่อแนบสลิป"}<input type="file" id="slip" accept="image/*">${S.slip ? `<img src="${S.slip}" alt="สลิปที่แนบ">` : ""}</label>
    </section>` : ""}
    <p class="err" id="err">${esc(S.error)}</p>`;
    if(S.step === "pay") drawQR();
    foot.hidden = false;
    updateFoot();

  function updateFoot(){
    $("#total").textContent = baht(total());
    $("#cups").textContent = cups() ? `(${cups()} แก้ว)` : "";
    const go = $("#go");
    if(S.step === "pay"){
      go.textContent = S.sending ? "กำลังส่ง…" : "ส่งออเดอร์";

  function doneHTML(){
    const r = S.result;
    return `<section class="card done">
      <span class="ok">ได้รับออเดอร์และสลิปแล้ว ✓</span>

      <ul>${r.lines.map(l => `<li><span>${esc(l.name)} ×${l.qty}</span><span>${baht(l.qty * l.price)}</span></li>`).join("")}
        <li><b>รวม</b><b>${baht(r.total)}</b></li></ul>
      <div class="deliv"><b>ส่ง ${esc(C.deliveryDate)}</b> · ${esc(C.deliveryTime)}<br>ที่ ${esc(r.place)}<br>ผู้สั่ง ${esc(r.name)} · ${esc(r.contact)}</div>
      <p class="note">ร้านจะเช็คยอดแล้วยืนยันกลับทางช่องทางติดต่อนะคะ<br>${esc(C.shopNote || "")}</p>
      <div class="savelink">📌 กลับมาเช็คสถานะออเดอร์ได้ที่<br><a href="${esc(statusUrl())}" target="_top">${esc(statusUrl())}</a><br>
        <button class="ghost" type="button" id="copyLink" style="margin-top:8px">คัดลอกลิงก์</button><br><small style="color:var(--muted)">ใช้ชื่อและช่องทางติดต่อเดิมค้นหาได้จากทุกเครื่อง</small></div>
      <p style="margin:14px 0 0;display:flex;gap:10px;justify-content:center;flex-wrap:wrap"><button class="ghost" type="button" id="seeStatus">ดูสถานะออเดอร์</button><button class="cta" type="button" id="again">สั่งอีกออเดอร์</button></p>
    </section>`;
  }

  /* ---------- เช็คออเดอร์: ลูกค้ากลับมาดูสถานะเองได้ ----------
     สถานะมาจากคอลัมน์ "สถานะ" ในชีต: ร้านเปลี่ยนเป็น ชำระแล้ว = ยืนยันออเดอร์ */
  function statusUrl(){
    if(C.shopUrl) return C.shopUrl + "?p=quick&v=status";
    return location.href.split(/[?#]/)[0] + "?v=status";
  }
  const ST = {
    "รอเช็คสลิป": ["", "⏳ รอร้านเช็คสลิป"],
    "ชำระแล้ว":   ["paid", "✓ ร้านยืนยันแล้ว"],
    "ส่งแล้ว":    ["sent", "🎉 ส่งแล้ว"],
    "ยกเลิก":     ["cancel", "ยกเลิก"]
  };
  const stOf = s => ST[String(s || "รอเช็คสลิป").trim()] || ["", s];
  function statusHTML(){
    let list = "";
    if(S.histLoading) list = `<p class="note">กำลังโหลดออเดอร์…</p>`;
    else if(S.histError) list = `<p class="err">${esc(S.histError)}</p>`;
    else if(S.hist) list = S.hist.length ? S.hist.map(o => { const [cls, label] = stOf(o.status); return `<div class="hcard">
        <div class="top"><b>${esc(o.orderNo)}</b><span class="st ${cls}">${esc(label)}</span></div>

        <div>${esc(o.items || "")}</div>
        <div class="tot"><span>ยอดรวม</span><span>${baht(o.total || 0)}</span></div></div>`; }).join("")
      : `<p class="note">ยังไม่เจอออเดอร์ค่ะ ลองเช็คชื่อและช่องทางติดต่อว่าตรงกับตอนสั่งไหมนะคะ</p>`;
    return `<section class="card"><h2>🧾 เช็คสถานะออเดอร์</h2>
      <div class="field" style="margin-top:0"><label for="qName">ชื่อที่ใช้ตอนสั่ง</label><input id="qName" value="${esc(S.q.name)}" autocomplete="name"></div>
      <div class="field"><label for="qContact">ช่องทางติดต่อที่ใช้ตอนสั่ง</label><input id="qContact" value="${esc(S.q.contact)}"></div>
      <p style="margin:12px 0 0;text-align:center"><button class="cta green" type="button" id="qFind">ค้นหาออเดอร์</button></p>
      ${list}
      <p class="hint" style="text-align:center">สถานะอัปเดตจากร้าน · ✓ ร้านยืนยันแล้ว = ร้านได้รับเงินแล้วค่ะ</p>
    </section>`;
  }
  function loadStatus(){
    S.histLoading = true; S.histError = ""; render();
    call("getMyOrders", [device(), S.q.name, S.q.contact]).then(list => {
      S.hist = list || []; S.histLoading = false; render();
    }).catch(() => { S.histLoading = false; S.histError = "โหลดออเดอร์ไม่สำเร็จ ลองใหม่อีกครั้งนะคะ"; render(); });

  function openStatus(){

    loadStatus(); toTop();
  }
  $("#tabStatus").addEventListener("click", openStatus);
  $("#tabOrder").addEventListener("click", () => { S.view = "order"; render(); toTop(); });

  /* PromptPay QR (EMVCo), same as the main shop */
  const maskPP = p => { const d = String(p).replace(/\D/g, ""); return d.length > 4 ? "xxx-xxx-" + d.slice(-4) : d; };
  function crc16(s){ let c = 0xFFFF; for(let i = 0; i < s.length; i++){ c ^= s.charCodeAt(i) << 8; for(let j = 0; j < 8; j++) c = (c & 0x8000) ? ((c << 1) ^ 0x1021) : (c << 1); c &= 0xFFFF; } return c.toString(16).toUpperCase().padStart(4, "0"); }
  function ppPayload(id, amount){
    const f = (t, v) => t + String(v.length).padStart(2, "0") + v;
    const d = String(id).replace(/\D/g, "");
    let tag, target;
    if(d.length === 10){ tag = "01"; target = ("0066" + d.slice(1)).padStart(13, "0"); }
    else if(d.length === 13){ tag = "02"; target = d; }
    else if(d.length === 15){ tag = "03"; target = d; }
    else return null;
    const p = f("00","01") + f("01","12") + f("29", f("00","A000000677010111") + f(tag, target)) + f("58","TH") + f("53","764") + f("54", amount.toFixed(2)) + "6304";
    return p + crc16(p);
  }
  function drawQR(){
    const box = $("#qr"); if(!box) return; box.innerHTML = "";
    const payload = C.promptpay ? ppPayload(C.promptpay, total()) : null;
    if(!payload || typeof QRCode === "undefined"){ box.innerHTML = `<div class="qr-demo">${DEMO ? "QR พร้อมเพย์จริงจะขึ้นตรงนี้" : "ยังไม่มีเบอร์พร้อมเพย์ในตั้งค่าร้าน"}</div>`; return; }
    new QRCode(box, {text: payload, width: 190, height: 190, correctLevel: QRCode.CorrectLevel.M});
  }

  function shrink(file){
    return new Promise((ok, no) => {
      const r = new FileReader();
      r.onload = () => { const img = new Image(); img.onload = () => {
        const k = Math.min(1, 1400 / Math.max(img.width, img.height));
        const c = document.createElement("canvas"); c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
        c.getContext("2d").drawImage(img, 0, 0, c.width, c.height); ok(c.toDataURL("image/jpeg", 0.85));
      }; img.onerror = no; img.src = r.result; };
      r.onerror = no; r.readAsDataURL(file);
    });
  }

  /* ---------- events ---------- */
  const main = $("#main");
  main.addEventListener("click", e => {
    const b = e.target.closest("button[data-k]");
    if(b){
      const bag = b.dataset.k === "m" ? S.mq : S.aq, id = b.dataset.id;
      bag[id] = Math.max(0, Math.min(20, (bag[id] || 0) + Number(b.dataset.d)));
      S.error = ""; render(); return;
    }
    if(e.target.closest("#seeStatus")){ openStatus(); return; }
    if(e.target.closest("#copyLink")){
      const btn = e.target.closest("#copyLink"), url = statusUrl();
      const done = () => { btn.textContent = "คัดลอกแล้ว ✓"; };
      if(navigator.clipboard) navigator.clipboard.writeText(url).then(done, () => prompt("คัดลอกลิงก์นี้", url));
      else prompt("คัดลอกลิงก์นี้", url);
      return;
    }
    if(e.target.closest("#qFind")){
      S.q = {name: $("#qName").value.trim(), contact: $("#qContact").value.trim()};
      try{ localStorage.setItem("mumujuu-quick-me", JSON.stringify(S.q)); }catch(err){}
      loadStatus(); return;
    }
    if(e.target.closest("#again")){
      S.mq = {}; S.aq = {}; S.comment = ""; S.slip = ""; S.step = "form"; S.result = null; render(); refresh(); toTop();
    }
  });
  main.addEventListener("input", e => {
    const id = e.target.id;
    if(id === "name" || id === "contact" || id === "comment" || id === "detail"){ S[id] = e.target.value; updateFoot(); }
  });
  main.addEventListener("change", async e => {
    if(e.target.name === "loc"){ S.loc = e.target.value; S.detail = ""; render(); return; }
    if(e.target.id === "slip" && e.target.files[0]){
      try{ S.slip = await shrink(e.target.files[0]); S.error = ""; }catch(err){ S.error = "อ่านรูปสลิปไม่ได้ ลองเลือกรูปใหม่นะคะ"; }
      render();
    }
  });

  $("#go").addEventListener("click", () => {
    const go = $("#go");
    if(!formOk() || S.sending) return;
    if(S.step === "form"){            // check cups with the sheet before showing the QR
      go.disabled = true; go.textContent = "กำลังเช็คจำนวนแก้ว…";
      call("getStock", []).then(st => {
        const cut = applyStock(st);
        if(cut.length){ S.error = "ขอโทษนะคะ " + cut.join(", ") + " ปรับจำนวนให้แล้วค่ะ"; render(); return; }
        if(st.open && cups() > 0 && (left() == null || cups() <= left())){ S.step = "pay"; S.error = ""; render(); $("#paySec").scrollIntoView({behavior: "smooth", block: "start"}); return; }
        S.error = !st.open ? "" : left() ? `ขอโทษนะคะ ตอนนี้เหลือแค่ ${left()} แก้ว ลองลดจำนวนลงนะคะ` : "ขอโทษนะคะ รอบนี้ครบจำนวนแล้วค่ะ 💚";
        render();
      }).catch(() => { S.error = "เช็คจำนวนแก้วไม่สำเร็จ ลองกดอีกครั้งนะคะ"; render(); });
      return;
    }
    if(!S.slip) return;
    S.sending = true; S.error = ""; updateFoot();
    try{ localStorage.setItem("mumujuu-quick-me", JSON.stringify({name: S.name.trim(), contact: S.contact.trim()})); }catch(e){}
    const order = {
      device: device(), loc: S.loc, detail: S.detail, name: S.name, contact: S.contact, comment: S.comment, slip: S.slip,
      items: C.mains.map(m => ({id: m.id, qty: S.mq[m.id] || 0})).filter(x => x.qty > 0),
      addons: C.addons.map(a => ({id: a.id, qty: S.aq[a.id] || 0})).filter(x => x.qty > 0)
    };
    call("submitOrder", [order]).then(res => {
      if(DEMO){
        res = Object.assign({total: total(), name: S.name.trim(), contact: S.contact.trim(),
          place: S.detail.trim() ? S.loc + " · " + S.detail.trim() : S.loc,
          lines: C.mains.filter(m => S.mq[m.id]).map(m => ({name: m.name, qty: S.mq[m.id], price: price(m)}))}, res);
      }
      S.sending = false; S.result = res; S.step = "done";
      S.q = {name: S.name.trim(), contact: S.contact.trim()}; S.hist = null;
      if(DEMO) DEMO_ORDERS.unshift({orderNo: res.orderNo, time: res.time, date: C.deliveryDate + " " + C.deliveryTime, place: res.place,
        items: res.lines.map(l => l.name + " ×" + l.qty).join(", "), total: res.total, status: "รอเช็คสลิป"});
      if(res.left != null) C.left = res.left;
      render(); toTop();
    }).catch(err => {
      S.sending = false; S.error = "ส่งไม่สำเร็จ: " + (err && err.message ? err.message : err); render();
    });
  });

  function refresh(){ call("getStock", []).then(st => { applyStock(st); if(S.step !== "done") render(); else header(); }).catch(() => {}); }

  /* ---------- start ---------- */
  function start(cfg){
    C = cfg; C.mains = C.mains || []; C.addons = C.addons || []; C.places = C.places || [];
    if(C.places.length === 1) S.loc = C.places[0].name;
    document.title = "สั่งน้ำ · " + C.shopName + " " + C.shopSub;
    if(C.view === "status" || /[?&]v=status/.test(location.search)){ if(window.MJ_INTRO) MJ_INTRO.hide(); openStatus(); } else render();
  }
  if(GAS) start(SERVER);
  else if(DEMO) start(JSON.parse(JSON.stringify(DEMO_CFG)));
  else {
    const load = tries => call("config", []).then(start).catch(() => {
      if(tries > 0) return setTimeout(() => load(tries - 1), 1500);
      $("#main").innerHTML = `<div class="card closed">โหลดเมนูไม่สำเร็จ ลองรีเฟรชหน้าอีกครั้งนะคะ</div>`;
    });
    load(2);
  }
})();
</script>
</body></html>
